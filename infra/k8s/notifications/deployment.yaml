apiVersion: apps/v1
kind: Deployment
metadata:
  name: notifications
spec:
  replicas: 3
  selector:
    matchLabels:
      app: notifications
  template:
    metadata:
      labels:
        app: notifications
    spec:
      containers:
        - name: notifications
          image: registry.example.com/acme/notifications:latest
          ports:
            - containerPort: 8968
